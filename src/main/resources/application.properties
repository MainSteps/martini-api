# Servidor: accesible desde el emulador o un celular en la misma red
server.port=8080
server.address=0.0.0.0
spring.application.name=martini-api

# H2 en archivo: los datos sobreviven un reinicio (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/martinidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza las tablas al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
